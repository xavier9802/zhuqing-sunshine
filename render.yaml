# Render Blueprint for the full-stack Zhuqing Sunshine MVP.
# Singapore region keeps web, API, worker, and database together.
# Estimated baseline: about US$40/month before additional storage/bandwidth.
services:
  - type: web
    name: zhuqing-sunshine-web
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: feature/m1-geography-weather-ingestion
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zhuqing-sunshine-api.onrender.com

  - type: web
    name: zhuqing-sunshine-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: feature/m1-geography-weather-ingestion
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://zhuqing-sunshine-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: zhuqing-sunshine-db
          property: connectionString

  - type: worker
    name: zhuqing-sunshine-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: feature/m1-geography-weather-ingestion
    dockerfilePath: ./services/worker/Dockerfile
    dockerContext: ./services/worker
    dockerCommand: start-production --interval-minutes 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zhuqing-sunshine-db
          property: connectionString
      - key: OPEN_METEO_USAGE
        value: non_commercial
      - key: DATA_DIR
        value: /tmp/zhuqing-data
      - key: GRID_SPACING_DEGREES
        value: "0.25"
      - key: FORECAST_DAYS
        value: "7"
      - key: WEATHER_BATCH_SIZE
        value: "25"
      - key: WEATHER_TIMEOUT_SECONDS
        value: "45"
      - key: WEATHER_MAX_ATTEMPTS
        value: "5"
      - key: WEATHER_MODELS
        value: ecmwf_ifs,ecmwf_ifs025,ecmwf_aifs025_single

databases:
  - name: zhuqing-sunshine-db
    postgresMajorVersion: "16"
    region: singapore
    plan: 0.5c-1g
    databaseName: zhuqing
    user: zhuqing
