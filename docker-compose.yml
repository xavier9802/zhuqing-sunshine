services:
  db:
    image: postgis/postgis:16-3.4
    container_name: zhuqing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhuqing}
      POSTGRES_USER: ${POSTGRES_USER:-zhuqing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - zhuqing-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhuqing} -d ${POSTGRES_DB:-zhuqing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./services/api
    container_name: zhuqing-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhuqing}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-zhuqing}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    container_name: zhuqing-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  zhuqing-postgres:
