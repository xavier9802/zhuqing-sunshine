services:
  db:
    image: postgis/postgis:16-3.4
    container_name: zhuqing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-zhuqing}
      POSTGRES_USER: \${POSTGRES_USER:-zhuqing}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - zhuqing-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \${POSTGRES_USER:-zhuqing} -d \${POSTGRES_DB:-zhuqing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
    container_name: zhuqing-api
    restart: unless-stopped
    environment:
      APP_ENV: \${APP_ENV:-development}
      WEB_ORIGIN: \${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://\${POSTGRES_USER:-zhuqing}:\${POSTGRES_PASSWORD:-change-me-locally}@db:5432/\${POSTGRES_DB:-zhuqing}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    container_name: zhuqing-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: \${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    profiles: ["jobs"]
    build:
      context: ./services/worker
    container_name: zhuqing-worker
    environment:
      DATABASE_URL: postgresql+psycopg://\${POSTGRES_USER:-zhuqing}:\${POSTGRES_PASSWORD:-change-me-locally}@db:5432/\${POSTGRES_DB:-zhuqing}
      DATA_DIR: /app/data
      OPEN_METEO_USAGE: \${OPEN_METEO_USAGE:-non_commercial}
      OPEN_METEO_API_KEY: \${OPEN_METEO_API_KEY:-}
      OPEN_METEO_BASE_URL: \${OPEN_METEO_BASE_URL:-}
      OPEN_METEO_SINGLE_RUNS_BASE_URL: \${OPEN_METEO_SINGLE_RUNS_BASE_URL:-}
      WEATHER_MODELS: \${WEATHER_MODELS:-ecmwf_ifs,ecmwf_ifs025,ecmwf_aifs025_single}
      FORECAST_DAYS: \${FORECAST_DAYS:-7}
      WEATHER_BATCH_SIZE: \${WEATHER_BATCH_SIZE:-25}
      WEATHER_TIMEOUT_SECONDS: \${WEATHER_TIMEOUT_SECONDS:-45}
      WEATHER_MAX_ATTEMPTS: \${WEATHER_MAX_ATTEMPTS:-5}
      GRID_SPACING_DEGREES: \${GRID_SPACING_DEGREES:-0.25}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  zhuqing-postgres:
