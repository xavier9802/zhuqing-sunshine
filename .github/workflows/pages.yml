name: Publish sunshine forecast to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect real forecasts and export static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sitegen/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache source geography
        uses: actions/cache@v4
        with:
          path: .cache/zhuqing
          key: geography-v1-${{ runner.os }}
      - name: Install forecast pipeline
        run: pip install -r sitegen/requirements.txt
      - name: Generate real ECMWF forecast snapshots
        env:
          OPEN_METEO_USAGE: non_commercial
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Keep the last successful site when all providers fail.
            python -m sitegen.build --mode live --require-live
          else
            # Initial release can show explicit no-data status, never fake forecasts.
            python -m sitegen.build --mode live
          fi
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build GitHub Pages static files
        env:
          NEXT_PUBLIC_BASE_PATH: /zhuqing-sunshine
        run: npm run build:web
      - name: Validate Pages output
        run: |
          test -f apps/web/out/data/status.json
          test -f apps/web/out/city/chengdu/index.html
          test -f apps/web/out/city/chongqing/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Publish Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
