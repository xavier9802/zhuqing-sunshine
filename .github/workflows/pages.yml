name: Publish sunshine forecast to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force_github_pages:
        description: "Force the GitHub Pages rollback deployment even when CloudBase is configured"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect real forecasts and export static site
    if: ${{ vars.CLOUDBASE_ENV_ID == '' || inputs.force_github_pages == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sitegen/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache source geography
        uses: actions/cache@v4
        with:
          path: .cache/zhuqing
          key: geography-v1-${{ runner.os }}
      - name: Install forecast pipeline
        run: pip install -r sitegen/requirements.txt
      - name: Generate real ECMWF forecast snapshots
        env:
          OPEN_METEO_USAGE: non_commercial
        run: |
          # Never replace the last valid public forecast with an empty snapshot,
          # including after a documentation or backtesting-only main push.
          python -m sitegen.build --mode live --require-live
      - name: Archive small forecast summary snapshot (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: forecast-summary-${{ github.run_id }}
          retention-days: 14
          path: |
            apps/web/public/data/status.json
            apps/web/public/data/overview/*.json
            apps/web/public/data/cities/*.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build GitHub Pages static files
        env:
          NEXT_PUBLIC_BASE_PATH: /zhuqing-sunshine
        run: npm run build:web
      - name: Validate Pages output
        run: |
          test -f apps/web/out/data/status.json
          test -f apps/web/out/city/chengdu/index.html
          test -f apps/web/out/city/chongqing/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Publish Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
