name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run build:web


  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all MVP containers
        run: docker compose build --parallel


  geography-smoke:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: zhuqing
          POSTGRES_USER: zhuqing
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhuqing -d zhuqing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/worker
    env:
      DATABASE_URL: postgresql+psycopg://zhuqing:test-password@localhost:5432/zhuqing
      DATA_DIR: /tmp/zhuqing-geography
      GRID_SPACING_DEGREES: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import live USGS basin and GeoNames city data
        run: python -m app.main import-geography | tee "/tmp/geography-import-summary.json"
      - name: Upload imported geography snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zhuqing-geography-smoke
          path: |
            /tmp/geography-import-summary.json
            /tmp/zhuqing-geography/geography/*.geojson
            /tmp/zhuqing-geography/geography/cities.json
