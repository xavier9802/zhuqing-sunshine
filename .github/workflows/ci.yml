name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run build:web


  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all MVP containers
        run: docker compose build --parallel


  geography-smoke:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: zhuqing
          POSTGRES_USER: zhuqing
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhuqing -d zhuqing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/worker
    env:
      DATABASE_URL: postgresql+psycopg://zhuqing:test-password@localhost:5432/zhuqing
      DATA_DIR: ${{ github.workspace }}/.smoke/data
      SUMMARY_PATH: ${{ github.workspace }}/.smoke/geography-import-summary.json
      GRID_SPACING_DEGREES: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import live USGS basin and GeoNames city data
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.smoke"
          python -m app.main import-geography > "$SUMMARY_PATH"
          cat "$SUMMARY_PATH"
      - name: Assert imported geometry and city coverage
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from shapely.geometry import shape

          root = Path(os.environ["DATA_DIR"]) / "geography"
          summary = json.loads(Path(os.environ["SUMMARY_PATH"]).read_text())
          boundary = json.loads((root / "sichuan_basin_boundary.geojson").read_text())
          grid = json.loads((root / "grid_cells.geojson").read_text())
          cities = json.loads((root / "cities.json").read_text())

          assert summary["cities"] == 14, summary
          assert summary["grid_cells"] > 0, summary
          assert len(boundary["features"]) == 1
          assert shape(boundary["features"][0]["geometry"]).is_valid
          assert len(grid["features"]) == summary["grid_cells"]
          assert all(shape(feature["geometry"]).is_valid for feature in grid["features"])
          assert len(cities) == 14
          assert len({city["slug"] for city in cities}) == 14
          print(json.dumps({
              "status": "verified",
              "cities": len(cities),
              "grid_cells": len(grid["features"]),
              "boundary_features": len(boundary["features"]),
              "grid_geometry_valid": True,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload imported geography snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zhuqing-geography-smoke
          path: |
            .smoke/geography-import-summary.json
            .smoke/data/geography/*.geojson
            .smoke/data/geography/cities.json
