name: Static MVP CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Build and verify database-free website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sitegen/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install static data generator dependencies
        run: pip install -r sitegen/requirements.txt
      - name: Lint generator
        run: ruff check sitegen
      - name: Test time windows and snapshot generation
        run: python -m pytest -q sitegen/tests
      - name: Generate honest placeholder for offline web build
        run: python -m sitegen.build --mode placeholder
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck:web
      - name: Lint
        run: npm run lint:web
      - name: Export static Next.js project site
        env:
          NEXT_PUBLIC_BASE_PATH: /zhuqing-sunshine
        run: npm run build:web
      - name: Verify exported routes and data
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/404.html
          test -f apps/web/out/data/status.json
          test -f apps/web/out/data/consensus.json
          test -f apps/web/out/data/overview/ecmwf_ifs.json
          test -f apps/web/out/city/chengdu/index.html
          test -f apps/web/out/city/chongqing/index.html
          test -f apps/web/out/city/luzhou/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("apps/web/out")
          data = json.loads((root/"data/status.json").read_text())
          assert data["status"] == "initializing"
          assert len(list((root/"city").glob("*/index.html"))) == 14
          print("14 city routes and explicit no-live-data state verified")
          PY
          du -sh apps/web/out


  real-provider-diagnostic-probe:
    if: github.ref == 'refs/heads/feature/forecast-quality-v1-1'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sitegen/requirements.txt
      - run: pip install -r sitegen/requirements.txt
      - name: Verify ECMWF low-cloud and daylight diagnostics for Chengdu
        run: python -m sitegen.probe

  full-basin-quality-smoke:
    if: github.ref == 'refs/heads/feature/forecast-quality-v1-1'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sitegen/requirements.txt
      - run: pip install -r sitegen/requirements.txt
      - name: Generate real full-basin HRES snapshot with cloud and visibility diagnostics
        run: |
          python -m sitegen.build --models ecmwf_ifs --mode live --require-live
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("apps/web/public/data")
          status = json.loads((root/"status.json").read_text())
          assert status["status"] == "available", status
          assert status["models"][0]["locations_count"] == 372, status["models"][0]
          overview = json.loads((root/"overview/ecmwf_ifs.json").read_text())
          assert len(overview["hourly"]) >= 24
          assert overview["hourly"][0]["cloud_diagnostic_completeness_pct"] >= 80
          assert overview["hourly"][0]["low_cloud_cover_pct"] is not None
          assert len(overview["daily_sunshine_hours"]) == 7
          cities = json.loads((root/"cities/ecmwf_ifs.json").read_text())
          assert len(cities["cities"]) == 14
          consensus = json.loads((root/"consensus.json").read_text())
          assert consensus["status"] == "limited" and consensus["best_sunny_day"] is None
          print(json.dumps({
            "grid_cells": 358,
            "cities": len(cities["cities"]),
            "hours": len(overview["hourly"]),
            "low_cloud_pct": overview["hourly"][0]["low_cloud_cover_pct"],
            "cloud_diagnostic_completeness_pct": overview["hourly"][0]["cloud_diagnostic_completeness_pct"],
            "visibility_m": overview["hourly"][0]["visibility_m"],
          }, indent=2))
          PY
          du -sh apps/web/public/data
